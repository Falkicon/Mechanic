name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: desktop
        run: |
          python -m pip install --upgrade --constraint constraints-dev.txt pip==25.2
          python -m pip install --constraint constraints-dev.txt -e ".[dev]"

      - name: Install Lua 5.1 (Linux contract tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          MECHANIC_LUA: /usr/bin/lua5.1
        run: pytest -v

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: pytest -v

  wheel-smoke:
    name: Installed wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel with pinned tooling
        working-directory: desktop
        run: |
          python -m pip install --upgrade --constraint constraints-dev.txt pip==25.2
          python -m pip install --constraint constraints-dev.txt build==1.5.0 setuptools==83.0.0 wheel==0.46.3
          python -m build --wheel --no-isolation --outdir wheel-dist

      - name: Install wheel into a clean environment
        working-directory: desktop
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install --upgrade --constraint constraints-dev.txt pip==25.2
          wheel-env/bin/python -m pip install --constraint constraints-dev.txt httpx==0.28.1
          wheel-env/bin/python -m pip install --constraint constraints-dev.txt wheel-dist/*.whl

      - name: Smoke-test installed wheel and dashboard
        working-directory: desktop
        run: wheel-env/bin/python scripts/wheel_smoke.py

  mcp-integration:
    name: MCP adapter integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned test stack and MCP
        working-directory: desktop
        run: |
          python -m pip install --upgrade --constraint constraints-dev.txt pip==25.2
          python -m pip install --constraint constraints-dev.txt -e ".[dev]"
          python -m pip install --constraint constraints-dev.txt mcp==1.28.1

      - name: Run MCP adapter tests
        working-directory: desktop
        run: pytest -q tests -k mcp

  test-dashboard:
    name: Dashboard regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dashboard regressions
        run: node tests/dashboard_regressions.cjs
      - name: Run dashboard schema regressions
        run: node tests/dashboard_schema_regressions.cjs
      - name: Check schema form JavaScript
        run: node --check desktop/dashboard/schema-form.js

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: desktop
        run: |
          python -m pip install --upgrade --constraint constraints-dev.txt pip==25.2
          python -m pip install --constraint constraints-dev.txt ruff==0.16.0

      - name: Check formatting
        working-directory: desktop
        run: ruff format --check src/ tests/

      - name: Check linting
        working-directory: desktop
        run: ruff check src/ tests/

  lint-lua:
    name: Lint (Lua)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run Luacheck
        run: luacheck "!Mechanic/" "Mechanic/" --config .luacheckrc

      - name: Run addon lifecycle regressions
        run: lua5.1 tests/addon_regressions.lua

      - name: Run addon overhead regressions
        run: lua5.1 tests/overhead_regressions.lua
